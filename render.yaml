services:
  - type: web
    name: pos-system-api
    runtime: node
    buildCommand: npm ci && npm --workspace backend run build
    startCommand: npm --workspace backend run migrate:up && npm --workspace backend run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: pos-system-db, property: connectionString }
      - key: DATABASE_SSL
        value: 'true'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: pos-system-db
    databaseName: pos_system
    user: pos_system
